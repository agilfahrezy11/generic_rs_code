[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remap-classes"
version = "0.1.0"
description = "Remap shapefile ID/class fields by merging multiple original classes into new combined classes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Agil" }
]
keywords = ["geospatial", "gis", "shapefile", "land-cover", "remote-sensing", "remap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "geopandas>=0.13",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
remap-classes = "remap_classes:main"

[tool.setuptools]
py-modules = ["remap_classes"]